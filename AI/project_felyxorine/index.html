<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Felyxorine</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #202020;

            font-family:
                Arial,
                sans-serif;

        }


        canvas {

            display: block;

        }

        #chat {

            position: fixed;

            left: 20px;
            bottom: 20px;

            width: 500px;
            height: 580px;

            min-width: 280px;
            min-height: 220px;

            display: flex;
            flex-direction: column;

            background:
                rgba(
                    20,
                    20,
                    20,
                    0.92
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            border-radius: 18px;

            backdrop-filter:
                blur(12px);

            color: white;

            z-index: 20;

            overflow: hidden;

        }

        #chat-header {

            height: 46px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 12px 0 16px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            cursor: grab;

            user-select: none;

        }


        #chat-header:active {

            cursor: grabbing;

        }


        #chat-title {

            font-size: 14px;

            font-weight: bold;

            opacity: 0.9;

        }


        #chat-hide {

            width: 28px;
            height: 28px;

            border: none;

            border-radius: 8px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            color: white;

            cursor: pointer;

        }


        #chat-hide:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

        }

        #messages {

            flex: 1;

            overflow-y: auto;

            padding: 20px;

            display: flex;

            flex-direction: column;

            gap: 12px;

        }


        .message {

            max-width: 85%;

            padding:
                11px 14px;

            border-radius: 14px;

            line-height: 1.5;

            word-break: break-word;

            white-space: pre-wrap;

            font-size: 15px;

        }


        .user {

            align-self: flex-end;

            background: #4b7bec;

        }


        .assistant {

            align-self: flex-start;

            background: #3a3a3a;

        }

        #input-area {

            display: flex;

            gap: 8px;

            padding: 12px;

            flex-shrink: 0;

        }


        #message-input {

            flex: 1;

            min-width: 0;

            border: none;

            outline: none;

            border-radius: 12px;

            padding: 13px;

            background: #303030;

            color: white;

            font-size: 15px;

        }


        #send-button {

            border: none;

            border-radius: 12px;

            padding:
                0 20px;

            background: white;

            color: #222;

            cursor: pointer;

        }


        #send-button:hover {

            background: #ddd;

        }

        #chat-resize {

            position: absolute;

            right: 3px;
            bottom: 3px;

            width: 18px;
            height: 18px;

            cursor: nwse-resize;

            opacity: 0.5;

        }


        #chat-resize::after {

            content: "";

            position: absolute;

            right: 2px;
            bottom: 2px;

            width: 10px;
            height: 10px;

            border-right:
                2px solid
                white;

            border-bottom:
                2px solid
                white;

        }

        #show-chat {

            position: fixed;

            left: 20px;
            bottom: 20px;

            z-index: 30;

            border: none;

            border-radius: 10px;

            padding:
                10px 14px;

            background:
                rgba(
                    20,
                    20,
                    20,
                    0.9
                );

            color: white;

            cursor: pointer;

            display: none;

        }


        #show-chat:hover {

            background:
                rgba(
                    50,
                    50,
                    50,
                    0.95
                );

        }

        #controls {

            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 290px;

            min-width: 240px;

            display: flex;

            flex-direction: column;

            gap: 12px;

            padding: 0 16px 16px;

            background:
                rgba(
                    20,
                    20,
                    20,
                    0.90
                );

            border-radius: 14px;

            color: white;

            z-index: 20;

            overflow: hidden;

        }

        #controls-header {

            height: 44px;

            margin:
                0 -16px;

            padding:
                0 10px 0 16px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            cursor: grab;

            user-select: none;

        }


        #controls-header:active {

            cursor: grabbing;

        }


        #controls-title {

            font-size: 13px;

            opacity: 0.7;

        }


        #controls-hide {

            width: 28px;
            height: 28px;

            border: none;

            border-radius: 8px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

            color: white;

            cursor: pointer;

        }


        #controls-hide:hover {

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );

        }

        .control-row {

            display: flex;

            align-items: center;

            justify-content:
                space-between;

            gap: 12px;

            font-size: 13px;

        }


        .control-row input {

            width: 160px;

        }


        #reset-camera {

            border: none;

            border-radius: 8px;

            padding: 9px;

            background: white;

            color: #222;

            cursor: pointer;

        }


        #reset-camera:hover {

            background: #ddd;

        }


        #show-controls {

            position: fixed;

            right: 20px;
            bottom: 20px;

            z-index: 30;

            border: none;

            border-radius: 10px;

            padding:
                10px 14px;

            background:
                rgba(
                    20,
                    20,
                    20,
                    0.9
                );

            color: white;

            cursor: pointer;

            display: none;

        }


        #show-controls:hover {

            background:
                rgba(
                    50,
                    50,
                    50,
                    0.95
                );

        }


        @media (
            max-width: 800px
        ) {

            #chat {

                width:
                    calc(
                        100vw - 40px
                    );

                height: 45vh;

            }


            #controls {

                right: 20px;

                bottom:
                    calc(
                        45vh + 35px
                    );

            }

        }

    </style>

</head>


<body>


    <div id="chat">

        <div id="chat-header">

            <span id="chat-title">
               Let's chat!
            </span>

            <button id="chat-hide">
                −
            </button>

        </div>


        <div id="messages">

            <div class="message assistant">
                How can I help you today?
            </div>

        </div>


        <div id="input-area">

            <input
                id="message-input"
                type="text"
                placeholder="enter message!"
                autocomplete="off"
            >


            <button id="send-button">
                send
            </button>

        </div>


        <div id="chat-resize"></div>

    </div>


    <button id="show-chat">
        💬 chat
    </button>

    <div id="controls">

        <div id="controls-header">

            <span id="controls-title">
                Avatar Controls
            </span>

            <button id="controls-hide">
                −
            </button>

        </div>


        <div class="control-row">

            <span>
                zoom
            </span>

            <input
                id="zoom-slider"
                type="range"
                min="1.5"
                max="6"
                step="0.05"
                value="3"
            >

        </div>


        <div class="control-row">

            <span>
                x
            </span>

            <input
                id="x-slider"
                type="range"
                min="-1"
                max="1"
                step="0.01"
                value="0"
            >

        </div>


        <div class="control-row">

            <span>
                y
            </span>

            <input
                id="y-slider"
                type="range"
                min="-1"
                max="1"
                step="0.01"
                value="0"
            >

        </div>


        <div class="control-row">

            <span>
               size
            </span>

            <input
                id="scale-slider"
                type="range"
                min="0.5"
                max="2.5"
                step="0.01"
                value="1"
            >

        </div>


        <button id="reset-camera">
            reset view
        </button>

    </div>

    <button id="show-controls">
        ⚙ settings
    </button>

    <script type="importmap">

    {
        "imports": {

            "three":
                "./node_modules/three/build/three.module.js",

            "three/addons/":
                "./node_modules/three/examples/jsm/",

            "@pixiv/three-vrm":
                "./node_modules/@pixiv/three-vrm/lib/three-vrm.module.js"

        }
    }

    </script>


    <script
        type="module"
        src="./main.js"
    ></script>


</body>

</html>
