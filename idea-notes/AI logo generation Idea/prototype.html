<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Logo Studio</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* ============================================================
   RESET
============================================================ */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0d0f14;
    color: #f5f7fb;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}


/* ============================================================
   APP
============================================================ */

.app {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 20px 60px;
}

.header {
    margin-bottom: 28px;
}

.header h1 {
    margin: 0;
    font-size: 32px;
    letter-spacing: -1px;
}

.header p {
    margin: 8px 0 0;
    color: #9299a8;
}


/* ============================================================
   PANELS
============================================================ */

.panel {
    background: #171a21;
    border: 1px solid #272c37;
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 20px;
}

.panel-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
}


/* ============================================================
   INPUT
============================================================ */

label {
    display: block;
    color: #c9ced8;
    font-size: 13px;
    font-weight: 600;
    margin: 14px 0 7px;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #303642;
    background: #101218;
    color: #fff;
    border-radius: 10px;
    padding: 12px 13px;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #6675ff;
}

textarea {
    min-height: 100px;
    resize: vertical;
}


/* ============================================================
   BUTTON
============================================================ */

.primary-btn {
    width: 100%;
    margin-top: 18px;
    border: 0;
    border-radius: 11px;
    padding: 14px 18px;

    background: #626cff;
    color: white;

    font-weight: 800;
    cursor: pointer;

    transition:
        transform .15s,
        background .15s;
}

.primary-btn:hover {
    background: #747dff;
    transform: translateY(-1px);
}

.primary-btn:disabled {
    opacity: .5;
    cursor: wait;
    transform: none;
}


/* ============================================================
   STATUS
============================================================ */

#status {
    min-height: 20px;
    margin: 12px 0 0;
    color: #9da5b5;
    font-size: 13px;
}


/* ============================================================
   CANDIDATES
============================================================ */

.candidates {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 14px;
}

.candidate {
    position: relative;

    border: 2px solid #292e3a;
    border-radius: 16px;

    background: #101218;

    padding: 10px;

    cursor: pointer;

    transition:
        border-color .15s,
        transform .15s,
        box-shadow .15s;
}

.candidate:hover {
    transform: translateY(-2px);
    border-color: #555f79;
}

.candidate.selected {
    border-color: #6c76ff;
    box-shadow:
        0 0 0 3px rgba(108,118,255,.12);
}

.candidate-preview {
    height: 230px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 11px;

    background:
        linear-gradient(45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(-45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e9e9e9 75%),
        linear-gradient(-45deg, transparent 75%, #e9e9e9 75%);

    background-size: 24px 24px;
    background-position:
        0 0,
        0 12px,
        12px -12px,
        -12px 0;

    overflow: hidden;
}

.candidate-preview svg {
    width: 90%;
    height: 90%;
}

.candidate-info {
    padding: 12px 5px 5px;
}

.candidate-title {
    font-weight: 800;
    font-size: 14px;
}

.candidate-description {
    color: #858d9c;
    font-size: 12px;
    margin-top: 4px;
}


/* ============================================================
   EDITOR
============================================================ */

.editor {
    display: grid;
    grid-template-columns:
        minmax(0, 1fr)
        310px;

    gap: 20px;
}

.main-preview {
    min-height: 580px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background:
        linear-gradient(45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(-45deg, #e9e9e9 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e9e9e9 75%),
        linear-gradient(-45deg, transparent 75%, #e9e9e9 75%);

    background-size: 32px 32px;

    background-position:
        0 0,
        0 16px,
        16px -16px,
        -16px 0;

    overflow: hidden;
}

.main-preview svg {
    width: 92%;
    max-height: 540px;
}


/* ============================================================
   CUSTOMIZE
============================================================ */

.customize {
    background: #101218;
    border: 1px solid #292e38;
    border-radius: 15px;
    padding: 18px;
}

.customize h3 {
    margin: 0 0 18px;
    font-size: 17px;
}

.control-title {
    margin-top: 18px;
    margin-bottom: 8px;

    color: #dce0e8;

    font-size: 13px;
    font-weight: 700;
}


/* ============================================================
   OPTION BUTTONS
============================================================ */

.option-grid {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 7px;
}

.option {
    border: 1px solid #303642;
    border-radius: 9px;

    background: #181c24;
    color: #cdd2dc;

    padding: 9px 6px;

    font-size: 12px;

    cursor: pointer;
}

.option:hover {
    border-color: #58627d;
}

.option.active {
    background: #626cff;
    border-color: #626cff;
    color: white;
}


/* ============================================================
   COLOR
============================================================ */

.color-options {
    display: grid;
    grid-template-columns:
        repeat(4, 1fr);

    gap: 8px;
}

.color-option {
    height: 38px;

    border-radius: 9px;

    border: 2px solid transparent;

    cursor: pointer;
}

.color-option.active {
    border-color: white;
    box-shadow:
        0 0 0 2px #626cff;
}

.color-purple {
    background: linear-gradient(
        135deg,
        #6366f1,
        #a855f7
    );
}

.color-blue {
    background: linear-gradient(
        135deg,
        #2563eb,
        #06b6d4
    );
}

.color-black {
    background: linear-gradient(
        135deg,
        #111827,
        #374151
    );
}

.color-green {
    background: linear-gradient(
        135deg,
        #059669,
        #84cc16
    );
}


/* ============================================================
   CUSTOM COLOR
============================================================ */

.custom-color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}

.custom-color-row input[type="color"] {
    width: 48px;
    height: 38px;
    padding: 3px;
}


/* ============================================================
   DOWNLOAD
============================================================ */

.downloads {
    display: grid;
    grid-template-columns:
        repeat(2, 1fr);

    gap: 8px;

    margin-top: 14px;
}

.downloads button {
    border: 1px solid #303642;
    background: #181c24;
    color: white;

    border-radius: 9px;

    padding: 11px;

    cursor: pointer;
}

.downloads button:hover {
    background: #222733;
}


/* ============================================================
   EMPTY
============================================================ */

.empty {
    color: #777f8e;
    text-align: center;
    padding: 80px 20px;
}


/* ============================================================
   RESPONSIVE
============================================================ */

@media (max-width: 900px) {

    .candidates {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .editor {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    .app {
        padding: 20px 12px;
    }

    .candidates {
        grid-template-columns: 1fr;
    }

    .candidate-preview {
        height: 260px;
    }

}

</style>

</head>


<body>

<div class="app">


<!-- ==========================================================
     HEADER
=========================================================== -->

<div class="header">

    <h1>✨ AI Logo Studio</h1>

    <p>
        Generate four different brand directions and customize your favorite.
    </p>

</div>


<!-- ==========================================================
     INPUT
=========================================================== -->

<div class="panel">

    <div class="panel-title">
        Brand Information
    </div>


    <label>
        Gemini API Key
    </label>

    <input
        id="key"
        type="password"
        placeholder="Enter your Gemini API key"
    >


    <label>
        Brand Name
    </label>

    <input
        id="brand"
        placeholder="e.g. AURIX"
    >


    <label>
        Brand Description
    </label>

    <textarea
        id="desc"
        placeholder="e.g. AI productivity platform for developers"
    ></textarea>


    <button
        id="generateButton"
        class="primary-btn"
        onclick="generate()"
    >
        Generate 4 Logo Concepts
    </button>


    <p id="status"></p>

</div>


<!-- ==========================================================
     CANDIDATES
=========================================================== -->

<div class="panel">

    <div class="panel-title">
        Choose a Direction
    </div>


    <div
        id="candidates"
        class="candidates"
    >

        <div class="empty">
            Generate your first logo concepts.
        </div>

    </div>

</div>


<!-- ==========================================================
     EDITOR
=========================================================== -->

<div class="panel">

    <div class="panel-title">
        Customize
    </div>


    <div class="editor">


        <!-- PREVIEW -->

        <div
            id="mainPreview"
            class="main-preview"
        >

            <div class="empty">
                Select a logo concept.
            </div>

        </div>


        <!-- CUSTOMIZE -->

        <div class="customize">

            <h3>
                Customize Logo
            </h3>


            <!-- ICON -->

            <div class="control-title">
                Icon
            </div>

            <div
                id="iconOptions"
                class="option-grid"
            ></div>


            <!-- LAYOUT -->

            <div class="control-title">
                Layout
            </div>

            <div
                id="layoutOptions"
                class="option-grid"
            >

                <button
                    class="option"
                    data-layout="icon-top"
                    onclick="setLayout('icon-top')"
                >
                    Top
                </button>

                <button
                    class="option"
                    data-layout="icon-left"
                    onclick="setLayout('icon-left')"
                >
                    Left
                </button>

                <button
                    class="option"
                    data-layout="icon-only"
                    onclick="setLayout('icon-only')"
                >
                    Icon only
                </button>

            </div>


            <!-- COLOR -->

            <div class="control-title">
                Color
            </div>


            <div class="color-options">

                <button
                    class="color-option color-purple"
                    data-color="purple"
                    onclick="setColorTheme('purple')"
                    title="Purple"
                ></button>

                <button
                    class="color-option color-blue"
                    data-color="blue"
                    onclick="setColorTheme('blue')"
                    title="Blue"
                ></button>

                <button
                    class="color-option color-black"
                    data-color="black"
                    onclick="setColorTheme('black')"
                    title="Black"
                ></button>

                <button
                    class="color-option color-green"
                    data-color="green"
                    onclick="setColorTheme('green')"
                    title="Green"
                ></button>

            </div>


            <div class="custom-color-row">

                <input
                    id="customColor"
                    type="color"
                    value="#6366f1"
                    onchange="setCustomColor(this.value)"
                >

                <span>
                    Custom
                </span>

            </div>


            <!-- TYPOGRAPHY -->

            <div class="control-title">
                Typography
            </div>


            <div class="option-grid">

                <button
                    class="option"
                    data-font="modern"
                    onclick="setTypography('modern')"
                >
                    Modern
                </button>

                <button
                    class="option"
                    data-font="geometric"
                    onclick="setTypography('geometric')"
                >
                    Geometric
                </button>

                <button
                    class="option"
                    data-font="elegant"
                    onclick="setTypography('elegant')"
                >
                    Elegant
                </button>

            </div>


            <!-- DOWNLOAD -->

            <div class="downloads">

                <button onclick="downloadSVG()">
                    SVG
                </button>

                <button onclick="downloadPNG()">
                    PNG
                </button>

            </div>

        </div>

    </div>

</div>


</div>


<script>

/* ============================================================
   GLOBAL STATE
============================================================ */

let concepts = [];

let selectedIndex = -1;

let currentDesign = null;

let currentSVG = "";

let brandName = "";


/* ============================================================
   ICONS
============================================================ */

const ICONS = [

    "brain",
    "cpu",
    "rocket",
    "sparkles",
    "shield",
    "code",
    "code-2",
    "gamepad-2",
    "bot",
    "cloud",
    "globe",
    "zap",
    "layers",
    "database",
    "terminal",
    "monitor",
    "smartphone",
    "camera",
    "heart",
    "star",
    "circle",
    "hexagon",
    "triangle",
    "leaf",
    "flame",
    "coffee",
    "music",
    "palette",
    "gem",
    "crown",
    "lock",
    "key",
    "target",
    "activity",
    "network",
    "boxes",
    "command",
    "workflow",
    "wand-2"

];


/* ============================================================
   COLOR THEMES
============================================================ */

const COLOR_THEMES = {

    purple: {

        primary: "#6366f1",
        secondary: "#111827",
        accent: "#a855f7",
        text: "#111827"

    },

    blue: {

        primary: "#2563eb",
        secondary: "#0f172a",
        accent: "#06b6d4",
        text: "#111827"

    },

    black: {

        primary: "#111827",
        secondary: "#f3f4f6",
        accent: "#374151",
        text: "#111827"

    },

    green: {

        primary: "#059669",
        secondary: "#064e3b",
        accent: "#84cc16",
        text: "#111827"

    }

};


/* ============================================================
   TYPOGRAPHY
============================================================ */

const TYPOGRAPHY = {

    modern: {

        family:
            "Inter, Arial, sans-serif",

        weight: 700,

        spacing: 0

    },

    geometric: {

        family:
            "Arial, Helvetica, sans-serif",

        weight: 800,

        spacing: 1

    },

    elegant: {

        family:
            "Georgia, Times New Roman, serif",

        weight: 700,

        spacing: 0.5

    }

};


/* ============================================================
   GENERATE
============================================================ */

async function generate() {

    const key =
        document
            .getElementById("key")
            .value
            .trim();


    brandName =
        document
            .getElementById("brand")
            .value
            .trim();


    const desc =
        document
            .getElementById("desc")
            .value
            .trim();


    if (!key) {

        alert(
            "Gemini API Key를 입력해줘."
        );

        return;

    }


    if (!brandName) {

        alert(
            "Brand Name을 입력해줘."
        );

        return;

    }


    if (!desc) {

        alert(
            "Brand Description을 입력해줘."
        );

        return;

    }


    const button =
        document
            .getElementById(
                "generateButton"
            );


    button.disabled = true;


    setStatus(
        "AI가 4개의 서로 다른 디자인 방향을 설계하는 중..."
    );


    const prompt = `

You are a world-class professional brand identity designer.

Design FOUR genuinely different logo concepts
for the same brand.

Do NOT generate SVG.
Do NOT generate SVG paths.
Do NOT generate images.

You are generating DESIGN SPECIFICATIONS ONLY.

Brand name:
${brandName}

Brand description:
${desc}


The four concepts MUST represent these four
different creative directions:

1. Minimal
   Extremely simple, clean, memorable.

2. Symbolic
   Strong visual symbol with a clear metaphor.

3. Monogram
   Focus on the brand name initials or a typographic mark.

4. Emblem
   A badge-like or contained identity.


Do NOT make all four concepts look similar.

Each concept should have:

- appropriate Lucide icon
- layout
- shape
- professional color palette
- typography recommendation
- icon scale
- visual personality
- optional short tagline


Allowed icon names:

${ICONS.join(", ")}


Allowed layouts:

icon-top
icon-left
icon-only


Allowed shapes:

none
circle
rounded-square
hexagon
pill


Return ONLY valid JSON.

The result MUST be an array containing exactly FOUR objects.

Schema:

[
  {
    "direction": "Minimal",
    "description": "short explanation",
    "icon": "sparkles",
    "layout": "icon-top",
    "shape": "circle",
    "primaryColor": "#6366f1",
    "secondaryColor": "#111827",
    "accentColor": "#a855f7",
    "textColor": "#111827",
    "fontStyle": "modern",
    "fontWeight": 700,
    "letterSpacing": 0,
    "iconScale": 1,
    "tagline": ""
  }
]


Important rules:

- Exactly four objects.
- One object for each direction.
- Never invent a brand name.
- The brand name will be inserted separately by the application.
- Never return SVG.
- Never return paths.
- Use valid 6-digit hexadecimal colors.
- fontStyle must be modern, geometric or elegant.
- fontWeight must be 400, 500, 600, 700 or 800.
- iconScale must be between 0.75 and 1.25.
- letterSpacing must be between -1 and 5.
- tagline should usually be empty unless useful.
- Designs must look like professional commercial branding,
  not clip-art.
`;


    try {

        const response = await fetch(

            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="
            + encodeURIComponent(key),

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    contents: [

                        {

                            parts: [

                                {
                                    text: prompt
                                }

                            ]

                        }

                    ],

                    generationConfig: {

                        responseMimeType:
                            "application/json"

                    }

                })

            }

        );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                errorText
            );

        }


        const data =
            await response.json();


        let text =
            data
                ?.candidates?.[0]
                ?.content?.parts?.[0]
                ?.text;


        if (!text) {

            throw new Error(
                "Gemini returned no content."
            );

        }


        text =
            cleanJSON(text);


        let parsed =
            JSON.parse(text);


        if (!Array.isArray(parsed)) {

            if (
                Array.isArray(
                    parsed.concepts
                )
            ) {

                parsed =
                    parsed.concepts;

            } else {

                throw new Error(
                    "Gemini did not return an array."
                );

            }

        }


        concepts =
            parsed
                .slice(0, 4)
                .map(
                    normalizeDesign
                );


        while (
            concepts.length < 4
        ) {

            concepts.push(
                fallbackDesign(
                    concepts.length
                )
            );

        }


        renderCandidates();


        selectConcept(0);


        setStatus(
            "4개의 디자인 방향이 완성됐어 ✨"
        );


    } catch (error) {

        console.error(error);


        /*
         * Gemini가 JSON을 개판으로 반환해도
         * MVP가 죽지 않도록 fallback.
         */

        concepts = [

            fallbackDesign(0),

            fallbackDesign(1),

            fallbackDesign(2),

            fallbackDesign(3)

        ];


        renderCandidates();


        selectConcept(0);


        setStatus(
            "AI 응답을 해석하지 못해서 기본 디자인을 표시했어."
        );

    }


    button.disabled = false;

}


/* ============================================================
   CLEAN JSON
============================================================ */

function cleanJSON(text) {

    text =
        text
            .replace(
                /```json/gi,
                ""
            )
            .replace(
                /```/g,
                ""
            )
            .trim();


    const first =
        text.indexOf("[");


    const last =
        text.lastIndexOf("]");


    if (
        first !== -1 &&
        last !== -1
    ) {

        text =
            text.substring(
                first,
                last + 1
            );

    }


    return text;

}


/* ============================================================
   NORMALIZE DESIGN
============================================================ */

function normalizeDesign(
    design,
    index = 0
) {

    const fallback =
        fallbackDesign(index);


    return {

        direction:
            validDirection(
                design.direction,
                fallback.direction
            ),

        description:
            typeof design.description === "string"
                ? design.description
                : fallback.description,

        icon:
            ICONS.includes(
                design.icon
            )
                ? design.icon
                : fallback.icon,

        layout:
            validLayout(
                design.layout,
                fallback.layout
            ),

        shape:
            validShape(
                design.shape,
                fallback.shape
            ),

        primaryColor:
            validColor(
                design.primaryColor,
                fallback.primaryColor
            ),

        secondaryColor:
            validColor(
                design.secondaryColor,
                fallback.secondaryColor
            ),

        accentColor:
            validColor(
                design.accentColor,
                fallback.accentColor
            ),

        textColor:
            validColor(
                design.textColor,
                fallback.textColor
            ),

        fontStyle:
            validFont(
                design.fontStyle,
                fallback.fontStyle
            ),

        fontWeight:
            [400,500,600,700,800]
                .includes(
                    Number(
                        design.fontWeight
                    )
                )
                ? Number(
                    design.fontWeight
                )
                : fallback.fontWeight,

        letterSpacing:
            clamp(
                Number(
                    design.letterSpacing
                ) || 0,
                -1,
                5
            ),

        iconScale:
            clamp(
                Number(
                    design.iconScale
                ) || 1,
                .75,
                1.25
            ),

        tagline:
            typeof design.tagline === "string"
                ? design.tagline
                : ""

    };

}


/* ============================================================
   FALLBACK
============================================================ */

function fallbackDesign(
    index
) {

    const designs = [

        {

            direction: "Minimal",

            description:
                "Simple, clean and memorable.",

            icon: "sparkles",

            layout: "icon-top",

            shape: "circle",

            primaryColor: "#6366f1",

            secondaryColor: "#f3f4f6",

            accentColor: "#a855f7",

            textColor: "#111827",

            fontStyle: "modern",

            fontWeight: 700,

            letterSpacing: 0,

            iconScale: 1,

            tagline: ""

        },

        {

            direction: "Symbolic",

            description:
                "A strong symbolic brand mark.",

            icon: "brain",

            layout: "icon-left",

            shape: "rounded-square",

            primaryColor: "#2563eb",

            secondaryColor: "#eff6ff",

            accentColor: "#06b6d4",

            textColor: "#111827",

            fontStyle: "geometric",

            fontWeight: 700,

            letterSpacing: 1,

            iconScale: 1,

            tagline: ""

        },

        {

            direction: "Monogram",

            description:
                "Typography-led identity.",

            icon: "command",

            layout: "icon-only",

            shape: "none",

            primaryColor: "#111827",

            secondaryColor: "#f3f4f6",

            accentColor: "#374151",

            textColor: "#111827",

            fontStyle: "elegant",

            fontWeight: 800,

            letterSpacing: 2,

            iconScale: 1,

            tagline: ""

        },

        {

            direction: "Emblem",

            description:
                "A contained badge-like identity.",

            icon: "shield",

            layout: "icon-top",

            shape: "hexagon",

            primaryColor: "#059669",

            secondaryColor: "#ecfdf5",

            accentColor: "#84cc16",

            textColor: "#111827",

            fontStyle: "modern",

            fontWeight: 700,

            letterSpacing: 0,

            iconScale: 0.95,

            tagline: ""

        }

    ];


    return designs[
        index % designs.length
    ];

}


/* ============================================================
   RENDER FOUR CANDIDATES
============================================================ */

function renderCandidates() {

    const container =
        document.getElementById(
            "candidates"
        );


    container.innerHTML = "";


    concepts.forEach(
        (design, index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "candidate";


            card.dataset.index =
                index;


            card.onclick =
                () => {

                    selectConcept(
                        index
                    );

                };


            const preview =
                renderSVG(
                    design,
                    brandName
                );


            card.innerHTML = `

                <div class="candidate-preview">

                    ${preview}

                </div>

                <div class="candidate-info">

                    <div class="candidate-title">

                        ${escapeHTML(
                            design.direction
                        )}

                    </div>

                    <div class="candidate-description">

                        ${escapeHTML(
                            design.description
                        )}

                    </div>

                </div>

            `;


            container.appendChild(
                card
            );

        }
    );

}


/* ============================================================
   SELECT CONCEPT
============================================================ */

function selectConcept(
    index
) {

    if (
        !concepts[index]
    ) {

        return;

    }


    selectedIndex =
        index;


    currentDesign =
        deepClone(
            concepts[index]
        );


    document
        .querySelectorAll(
            ".candidate"
        )
        .forEach(
            (card, i) => {

                card.classList.toggle(
                    "selected",
                    i === index
                );

            }
        );


    renderMain();


    updateControls();

}


/* ============================================================
   MAIN PREVIEW
============================================================ */

function renderMain() {

    const preview =
        document.getElementById(
            "mainPreview"
        );


    if (!currentDesign) {

        preview.innerHTML = `
            <div class="empty">
                Select a logo concept.
            </div>
        `;

        return;

    }


    preview.innerHTML =
        renderSVG(
            currentDesign,
            brandName
        );


    currentSVG =
        preview.innerHTML;

}


/* ============================================================
   SVG RENDERER
============================================================ */

function renderSVG(
    design,
    brand
) {

    const typography =
        TYPOGRAPHY[
            design.fontStyle
        ]
        || TYPOGRAPHY.modern;


    const fontFamily =
        typography.family;


    const fontWeight =
        design.fontWeight
        || typography.weight;


    const letterSpacing =
        design.letterSpacing
        ?? typography.spacing;


    const primary =
        design.primaryColor;


    const secondary =
        design.secondaryColor;


    const accent =
        design.accentColor;


    const textColor =
        design.textColor;


    const icon =
        design.icon;


    const scale =
        design.iconScale
        || 1;


    const layout =
        design.layout;


    const shape =
        design.shape;


    const iconSVG =
        getIconSVG(
            icon,
            primary
        );


    let svg;


    /* --------------------------------------------------------
       ICON ONLY
    -------------------------------------------------------- */

    if (
        layout === "icon-only"
    ) {

        svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 500 500"
        >

            ${shapeMarkup(
                shape,
                secondary,
                accent,
                70,
                70,
                360,
                360
            )}

            <g
                transform="
                    translate(190 190)
                    scale(${scale})
                "
            >

                ${iconSVG}

            </g>

        </svg>

        `;

    }


    /* --------------------------------------------------------
       ICON LEFT
    -------------------------------------------------------- */

    else if (
        layout === "icon-left"
    ) {

        svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 1000 420"
        >

            ${shapeMarkup(
                shape,
                secondary,
                accent,
                45,
                60,
                300,
                300
            )}

            <g
                transform="
                    translate(145 125)
                    scale(${scale})
                "
            >

                ${iconSVG}

            </g>


            <text
                x="400"
                y="220"
                fill="${textColor}"
                font-family="${fontFamily}"
                font-size="76"
                font-weight="${fontWeight}"
                letter-spacing="${letterSpacing}"
            >

                ${escapeXML(
                    brand
                )}

            </text>


            ${
                design.tagline
                ? `

                <text
                    x="403"
                    y="265"
                    fill="${textColor}"
                    opacity=".6"
                    font-family="${fontFamily}"
                    font-size="24"
                    letter-spacing=".5"
                >

                    ${escapeXML(
                        design.tagline
                    )}

                </text>

                `
                : ""
            }

        </svg>

        `;

    }


    /* --------------------------------------------------------
       ICON TOP
    -------------------------------------------------------- */

    else {

        svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 600 650"
        >

            ${shapeMarkup(
                shape,
                secondary,
                accent,
                100,
                30,
                400,
                400
            )}


            <g
                transform="
                    translate(200 125)
                    scale(${scale})
                "
            >

                ${iconSVG}

            </g>


            <text
                x="300"
                y="520"
                text-anchor="middle"
                fill="${textColor}"
                font-family="${fontFamily}"
                font-size="66"
                font-weight="${fontWeight}"
                letter-spacing="${letterSpacing}"
            >

                ${escapeXML(
                    brand
                )}

            </text>


            ${
                design.tagline
                ? `

                <text
                    x="300"
                    y="558"
                    text-anchor="middle"
                    fill="${textColor}"
                    opacity=".6"
                    font-family="${fontFamily}"
                    font-size="21"
                >

                    ${escapeXML(
                        design.tagline
                    )}

                </text>

                `
                : ""
            }

        </svg>

        `;

    }


    return svg;

}


/* ============================================================
   ICON SVG
============================================================ */

function getIconSVG(
    name,
    color
) {

    const container =
        document.createElement(
            "div"
        );


    container.innerHTML =
        `<i data-lucide="${name}"></i>`;


    lucide.createIcons({

        root: container

    });


    const svg =
        container.querySelector(
            "svg"
        );


    if (!svg) {

        return getIconSVG(
            "sparkles",
            color
        );

    }


    svg.setAttribute(
        "width",
        "100"
    );


    svg.setAttribute(
        "height",
        "100"
    );


    svg.setAttribute(
        "viewBox",
        "0 0 24 24"
    );


    svg.setAttribute(
        "stroke",
        color
    );


    svg.setAttribute(
        "stroke-width",
        "2"
    );


    svg.setAttribute(
        "fill",
        "none"
    );


    return svg.outerHTML;

}


/* ============================================================
   SHAPES
============================================================ */

function shapeMarkup(
    shape,
    fill,
    accent,
    x,
    y,
    width,
    height
) {

    if (
        shape === "circle"
    ) {

        return `

        <circle
            cx="${x + width / 2}"
            cy="${y + height / 2}"
            r="${Math.min(width,height) / 2}"
            fill="${fill}"
        />

        `;

    }


    if (
        shape === "rounded-square"
    ) {

        return `

        <rect
            x="${x}"
            y="${y}"
            width="${width}"
            height="${height}"
            rx="75"
            fill="${fill}"
        />

        `;

    }


    if (
        shape === "pill"
    ) {

        return `

        <rect
            x="${x}"
            y="${y + height * .2}"
            width="${width}"
            height="${height * .6}"
            rx="${height * .3}"
            fill="${fill}"
        />

        `;

    }


    if (
        shape === "hexagon"
    ) {

        const cx =
            x + width / 2;

        const cy =
            y + height / 2;

        const radius =
            width / 2;


        const points = [];


        for (
            let i = 0;
            i < 6;
            i++
        ) {

            const angle =
                Math.PI / 3 * i
                - Math.PI / 6;


            points.push(

                `${cx + radius * Math.cos(angle)},${cy + radius * Math.sin(angle)}`

            );

        }


        return `

        <polygon
            points="${points.join(" ")}"
            fill="${fill}"
        />

        `;

    }


    return "";

}


/* ============================================================
   ICON OPTIONS
============================================================ */

function buildIconOptions() {

    const container =
        document.getElementById(
            "iconOptions"
        );


    container.innerHTML = "";


    const visibleIcons = [

        "brain",
        "cpu",
        "rocket",
        "bot",
        "sparkles",
        "shield",
        "code",
        "gamepad-2",
        "cloud",
        "globe",
        "zap",
        "layers"

    ];


    visibleIcons.forEach(
        icon => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.dataset.icon =
                icon;


            button.innerText =
                icon;


            button.onclick =
                () => {

                    setIcon(
                        icon
                    );

                };


            container.appendChild(
                button
            );

        }
    );

}


/* ============================================================
   SET ICON
============================================================ */

function setIcon(
    icon
) {

    if (!currentDesign) {

        return;

    }


    currentDesign.icon =
        icon;


    renderMain();

    updateControls();

}


/* ============================================================
   SET LAYOUT
============================================================ */

function setLayout(
    layout
) {

    if (!currentDesign) {

        return;

    }


    currentDesign.layout =
        layout;


    renderMain();

    updateControls();

}


/* ============================================================
   SET COLOR
============================================================ */

function setColorTheme(
    theme
) {

    if (!currentDesign) {

        return;

    }


    const colors =
        COLOR_THEMES[theme];


    if (!colors) {

        return;

    }


    currentDesign.primaryColor =
        colors.primary;


    currentDesign.secondaryColor =
        colors.secondary;


    currentDesign.accentColor =
        colors.accent;


    currentDesign.textColor =
        colors.text;


    document
        .getElementById(
            "customColor"
        )
        .value =
        colors.primary;


    renderMain();

    updateControls();

}


/* ============================================================
   CUSTOM COLOR
============================================================ */

function setCustomColor(
    color
) {

    if (!currentDesign) {

        return;

    }


    currentDesign.primaryColor =
        color;


    currentDesign.accentColor =
        color;


    renderMain();

    updateControls();

}


/* ============================================================
   TYPOGRAPHY
============================================================ */

function setTypography(
    font
) {

    if (!currentDesign) {

        return;

    }


    if (!TYPOGRAPHY[font]) {

        return;

    }


    currentDesign.fontStyle =
        font;


    currentDesign.fontWeight =
        TYPOGRAPHY[
            font
        ].weight;


    currentDesign.letterSpacing =
        TYPOGRAPHY[
            font
        ].spacing;


    renderMain();

    updateControls();

}


/* ============================================================
   UPDATE CONTROLS
============================================================ */

function updateControls() {

    if (!currentDesign) {

        return;

    }


    document
        .querySelectorAll(
            "[data-icon]"
        )
        .forEach(
            element => {

                element.classList.toggle(

                    "active",

                    element.dataset.icon
                    === currentDesign.icon

                );

            }
        );


    document
        .querySelectorAll(
            "[data-layout]"
        )
        .forEach(
            element => {

                element.classList.toggle(

                    "active",

                    element.dataset.layout
                    === currentDesign.layout

                );

            }
        );


    document
        .querySelectorAll(
            "[data-font]"
        )
        .forEach(
            element => {

                element.classList.toggle(

                    "active",

                    element.dataset.font
                    === currentDesign.fontStyle

                );

            }
        );


    /*
     * Color active state
     */

    const primary =
        currentDesign.primaryColor
            .toLowerCase();


    document
        .querySelectorAll(
            "[data-color]"
        )
        .forEach(
            element => {

                const theme =
                    COLOR_THEMES[
                        element.dataset.color
                    ];


                element.classList.toggle(

                    "active",

                    theme &&
                    theme.primary
                        .toLowerCase()
                    === primary

                );

            }
        );


    document
        .getElementById(
            "customColor"
        )
        .value =
        validColor(
            currentDesign.primaryColor,
            "#6366f1"
        );

}


/* ============================================================
   DOWNLOAD SVG
============================================================ */

function downloadSVG() {

    if (!currentSVG) {

        return;

    }


    const svg =
        currentSVG
            .replace(
                "<svg",
                '<svg xmlns="http://www.w3.org/2000/svg"'
            );


    const blob =
        new Blob(
            [svg],
            {
                type:
                    "image/svg+xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        `${safeFileName(brandName)}-logo.svg`;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}


/* ============================================================
   DOWNLOAD PNG
============================================================ */

function downloadPNG() {

    if (!currentSVG) {

        return;

    }


    const parser =
        new DOMParser();


    const svgDocument =
        parser.parseFromString(
            currentSVG,
            "image/svg+xml"
        );


    const svgElement =
        svgDocument.documentElement;


    const serializer =
        new XMLSerializer();


    const svgText =
        serializer.serializeToString(
            svgElement
        );


    const blob =
        new Blob(
            [svgText],
            {
                type:
                    "image/svg+xml"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const image =
        new Image();


    image.onload =
        function() {

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                2048;

            canvas.height =
                2048;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            ctx.drawImage(
                image,
                0,
                0,
                2048,
                2048
            );


            const png =
                canvas.toDataURL(
                    "image/png"
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                png;


            link.download =
                `${safeFileName(brandName)}-logo.png`;


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            URL.revokeObjectURL(
                url
            );

        };


    image.onerror =
        function() {

            URL.revokeObjectURL(
                url
            );


            alert(
                "PNG 변환에 실패했어."
            );

        };


    image.src =
        url;

}


/* ============================================================
   UTILITIES
============================================================ */

function validColor(
    color,
    fallback
) {

    if (
        typeof color !== "string"
    ) {

        return fallback;

    }


    if (
        /^#[0-9A-Fa-f]{6}$/
            .test(color)
    ) {

        return color;

    }


    return fallback;

}


function validDirection(
    value,
    fallback
) {

    const allowed = [

        "Minimal",
        "Symbolic",
        "Monogram",
        "Emblem"

    ];


    return allowed.includes(
        value
    )
        ? value
        : fallback;

}


function validLayout(
    value,
    fallback
) {

    const allowed = [

        "icon-top",
        "icon-left",
        "icon-only"

    ];


    return allowed.includes(
        value
    )
        ? value
        : fallback;

}


function validShape(
    value,
    fallback
) {

    const allowed = [

        "none",
        "circle",
        "rounded-square",
        "hexagon",
        "pill"

    ];


    return allowed.includes(
        value
    )
        ? value
        : fallback;

}


function validFont(
    value,
    fallback
) {

    return TYPOGRAPHY[value]
        ? value
        : fallback;

}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function escapeXML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&apos;"
        );

}


function escapeHTML(
    value
) {

    return escapeXML(
        value
    );

}


function deepClone(
    object
) {

    return JSON.parse(
        JSON.stringify(
            object
        )
    );

}


function safeFileName(
    value
) {

    return String(
        value || "ai"
    )
        .replace(
            /[^a-zA-Z0-9가-힣_-]/g,
            "_"
        );

}


function setStatus(
    message
) {

    document
        .getElementById(
            "status"
        )
        .innerText =
        message;

}


/* ============================================================
   INIT
============================================================ */

buildIconOptions();

</script>
