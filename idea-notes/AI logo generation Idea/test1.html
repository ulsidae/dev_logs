<style>

/* ============================================================
   RESET
============================================================ */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: #0d0f14;
    color: #f5f7fb;

    font-family:
        Inter,
        "Noto Sans KR",
        Arial,
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
}


/* ============================================================
   APP
============================================================ */

.app {
    width: min(1200px, calc(100% - 32px));
    margin: 0 auto;
    padding: 34px 0 70px;
}

.header {
    margin-bottom: 26px;
}

.header h1 {
    margin: 0;

    font-size: 32px;
    line-height: 1.15;

    letter-spacing: -1.3px;
}

.header p {
    margin: 9px 0 0;

    color: #9299a8;

    font-size: 14px;
}


/* ============================================================
   PANEL
============================================================ */

.panel {
    background: #171a21;

    border: 1px solid #272c37;
    border-radius: 18px;

    padding: 22px;

    margin-bottom: 20px;
}

.panel-title {
    margin-bottom: 16px;

    font-size: 16px;
    font-weight: 700;
}


/* ============================================================
   INPUT
============================================================ */

label {
    display: block;

    margin: 14px 0 7px;

    color: #c9ced8;

    font-size: 13px;
    font-weight: 600;
}

input,
textarea,
select {
    width: 100%;

    border: 1px solid #303642;
    outline: none;

    background: #101218;
    color: white;

    border-radius: 10px;

    padding: 12px 13px;

    transition:

        box-shadow .15s;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #6675ff;

    box-shadow:
        0 0 0 3px rgba(102,117,255,.08);
}

textarea {
    min-height: 100px;
    resize: vertical;
}


/* ============================================================
   PRIMARY BUTTON
============================================================ */

.primary-btn {
    width: 100%;

    margin-top: 18px;

    border: 0;
    border-radius: 11px;

    padding: 14px 18px;

    background: #626cff;
    color: white;

    font-weight: 800;

    cursor: pointer;

    transition:
        transform .15s,
        background .15s;
}

.primary-btn:hover {
    background: #747dff;

    transform:
        translateY(-1px);
}

.primary-btn:disabled {
    opacity: .5;

    cursor: wait;

    transform: none;
}


/* ============================================================
   STATUS
============================================================ */

#status {
    min-height: 20px;

    margin: 12px 0 0;

    color: #9da5b5;

    font-size: 13px;
}


/* ============================================================
   CANDIDATES
============================================================ */

.candidates {
    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 14px;
}

.candidate {
    position: relative;

    border: 2px solid #292e3a;
    border-radius: 16px;

    background: #101218;

    padding: 10px;

    cursor: pointer;

    transition:
        border-color .15s,
        transform .15s,
        box-shadow .15s;
}

.candidate:hover {
    border-color: #555f79;

    transform:
        translateY(-2px);
}

.candidate.selected {
    border-color: #6c76ff;

    box-shadow:
        0 0 0 3px rgba(108,118,255,.12);
}


/* ============================================================
   TRANSPARENT PREVIEW
============================================================ */

.candidate-preview,
.main-preview {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background-color: #f8f9fb;


    background-image:
        linear-gradient(
            45deg,
            rgba(0,0,0,.025) 25%,
            transparent 25%
        ),
        linear-gradient(
            -45deg,
            rgba(0,0,0,.025) 25%,
            transparent 25%
        ),
        linear-gradient(
            45deg,
            transparent 75%,
            rgba(0,0,0,.025) 75%
        ),
        linear-gradient(
            -45deg,
            transparent 75%,
            rgba(0,0,0,.025) 75%
        );

    background-size: 28px 28px;

    background-position:
        0 0,
        0 14px,
        14px -14px,
        -14px 0;
}

.candidate-preview {
    aspect-ratio: 1 / 1;
}

.candidate-preview svg {
    width: 100%;
    height: 100%;
    display: block;
}


/* ============================================================
   CANDIDATE INFO
============================================================ */

.candidate-info {
    padding: 12px 5px 5px;
}

.candidate-title {
    font-size: 14px;
    font-weight: 800;
}

.candidate-description {
    margin-top: 4px;

    color: #858d9c;

    font-size: 12px;
    line-height: 1.5;
}


/* ============================================================
   EDITOR
============================================================ */

.editor {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        330px;

    gap: 20px;
}


/* ============================================================
   MAIN PREVIEW
============================================================ */

.main-preview {

    border-radius: 16px;

    padding: 35px;
}

.main-preview svg {
    width: min(100%, 560px);
    aspect-ratio: 1 / 1;

}


/* ============================================================
   CUSTOMIZE
============================================================ */

.customize {

    border: 1px solid #292e38;
    border-radius: 15px;

    padding: 18px;

    overflow: hidden;
}

.customize h3 {

}

.control-title {

    margin-bottom: 8px;

    font-weight: 700;

/* ============================================================
   OPTION GRID
============================================================ */

.option-grid {

.option {

}


/* ============================================================

============================================================ */

.icon-search {

.icon-search input {

.icon-search button:hover {

}

.icon-search-results {

    overflow-y: auto;
}

.icon-result {

}

}

.icon-search-status {

    font-size: 11px;

    min-height: 16px;

    margin-bottom: 5px;
}


/* ============================================================

============================================================ */

.color-options {

    grid-template-columns:

    gap: 8px;

.color-option {
    height: 38px;

    border: 2px solid transparent;

            #2563eb,
            #06b6d4

}

.color-black {
    background:

            135deg,
            #111827,
            #374151
        );
}

.color-green {
    background:
        linear-gradient(
            135deg,

/* ============================================================
   CUSTOM COLOR
============================================================ */

.custom-color-row {

.custom-color-row input[type="color"] {

/* ============================================================

============================================================ */

/* ============================================================

    }

</style>

/* ============================================================
   ICON QUERY TRANSLATION
============================================================ */

function expandIconQuery(query) {

    if (!query) {

        return "sparkles";

    }

    let value =
        String(query)
            .toLowerCase()
            .trim();


    const parts = [];


    for (
        const [k, v]
        of Object.entries(
            KOREAN_ICON_TERMS
        )
    ) {

        if (
            value.includes(k)
        ) {

            parts.push(v);

        }

    }


    parts.push(value);


    return [
        ...new Set(
            parts
                .join(" ")
                .split(/\s+/)
                .filter(Boolean)
        )
    ]
        .slice(0, 12)
        .join(" ");

}


/* ============================================================
   ICONIFY SEARCH
============================================================ */

async function searchIconify(
    query,
    limit = 8
) {

    const expanded =
        expandIconQuery(
            query
        );


    try {

        const url =
            `${ICONIFY_API}/search?query=${encodeURIComponent(expanded)}&limit=${limit}`;


        const response =
            await fetch(
                url,
                {
                    cache: "force-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Icon search failed."
            );

        }


        const data =
            await response.json();


        return (
            data.icons || []
        );

    } catch (error) {

        console.warn(
            "Iconify search error:",
            error
        );


        return [];

    }

}


/* ============================================================
   ICON SVG URL
============================================================ */

function iconURL(
    iconName
) {


    return `${ICONIFY_API}/${iconName}.svg`;

}


/* ============================================================
   LOAD ICON SVG
============================================================ */

async function loadIconSVG(
    iconName,
    color = "#111827"
) {

    if (!iconName) {

        return fallbackIconSVG(
            color
        );

    }


    try {

        const response =
            await fetch(
                iconURL(
                    iconName
                ),
                {
                    cache:
                        "force-cache"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Icon load failed"
            );

        }


        let svg =
            await response.text();


        /*
         * SVG를 그대로 중첩하기 때문에
         * 외부 SVG의 width / height는 제거.
         */

        svg =
            svg
                .replace(
                    /<\?xml[^>]*>/gi,
                    ""
                )
                .replace(
                    /<!DOCTYPE[^>]*>/gi,
                    ""
                )
                .replace(
                    /<svg([^>]*)>/i,
                    (match, attrs) => {

                        let clean =
                            attrs
                                .replace(
                                    /\s(width|height)="[^"]*"/gi,
                                    ""
                                )
                                .replace(
                                    /\sstyle="[^"]*"/gi,
                                    ""
                                );

                        return `<svg${clean}>`;

                    }
                );

        svg =
            svg
                .replace(
                    /currentColor/g,
                    color
                );


        return svg;

    } catch {

        return fallbackIconSVG(
            color
        );

    }

}

/* ============================================================

============================================================ */

function cleanJSON(
    text
) {

    return String(text)

        .replace(
            /```json/gi,
            ""
        )

        .replace(
            /```/g,
            ""
        )

        .trim();

}

function normalizeDesign(
    design,
    index = 0
) {

    const fallback =
        fallbackDesign(index);


    return {

        direction:
            validDirection(
                design?.direction,
                fallback.direction
            ),

        description:
            typeof design?.description === "string"
                ? design.description
                : fallback.description,

        iconQuery:
            typeof design?.iconQuery === "string"
                ? design.iconQuery
                : fallback.iconQuery,

        iconName:

        iconResults:

            validLayout(

            ),

            ),

        fontStyle:

            ),

                )

                )
                : fallback.fontWeight,

        letterSpacing:
            clamp(

                -1,
                5
            ),

        iconScale:
            clamp(
                Number(
                    design?.iconScale
                ) || 1,
                .75,
                1.2
            ),

        tagline:
            typeof design?.tagline === "string"

/* ============================================================
   SHAPES
============================================================ */

function shapeMarkup(
    shape,
    fill,
    accent,
    x,
    y,
    width,
    height
) {

    if (
        shape === "circle"
    ) {

        return `

            <circle
                cx="${x + width / 2}"
                cy="${y + height / 2}"
                r="${Math.min(width,height) / 2}"
                fill="${fill}"
            />

        `;

    }


    if (
        shape === "rounded-square"
    ) {

        return `

            <rect
                x="${x}"
                y="${y}"
                width="${width}"
                height="${height}"
                rx="${Math.min(width,height) * .18}"
                fill="${fill}"
            />

        `;

    }


    if (
        shape === "pill"
    ) {

        return `

            <rect
                x="${x}"
                y="${y + height * .2}"
                width="${width}"
                height="${height * .6}"
                rx="${height * .3}"
                fill="${fill}"
            />

        `;

    }


    if (
        shape === "hexagon"
    ) {

        const cx =
            x + width / 2;

        const cy =
            y + height / 2;

        const radius =
            Math.min(
                width,
                height
            ) / 2;


        const points = [];


        for (
            let i = 0;
            i < 6;
            i++
        ) {

            const angle =
                Math.PI / 3 * i
                - Math.PI / 6;


            points.push(

                `${cx + radius * Math.cos(angle)},${cy + radius * Math.sin(angle)}`

            );

        }


        return `

            <polygon
                points="${points.join(" ")}"
                fill="${fill}"
            />

        `;

    }


    return "";

}

        results.length
        ? `${results.length}개 아이콘을 찾았어`
        : "검색 결과가 없어.";


    renderIconResults();

}


/* ============================================================
   RENDER ICON RESULTS
============================================================ */

function renderIconResults() {

    const container =
        document.getElementById(
            "iconResults"
        );


    container.innerHTML = "";


    if (!currentDesign) {

        return;

    }


    const results =
        currentDesign.iconResults
        || [];


    results.forEach(
        iconName => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "icon-result";


            button.title =
                iconName;


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                iconURL(
                    iconName
                );


            img.loading =
                "lazy";


            const span =
                document.createElement(
                    "span"
                );


            span.innerText =
                iconName;


            button.appendChild(
                img
            );


            button.appendChild(
                span
            );


            button.onclick =
                () => {

                    setIcon(
                        iconName
                    );

                };


            container.appendChild(
                button
            );

        }
    );

}


/* ============================================================
   SET ICON
============================================================ */

function setIcon(
    iconName
) {

    if (!currentDesign) {

        return;

    }


    currentDesign.iconName =
        iconName;


    renderMain();

}


/* ============================================================
   SET LAYOUT
============================================================ */

function setLayout(
    layout
) {

    if (!currentDesign) {

        return;

    }


    currentDesign.layout =
        layout;


    renderMain();

    updateControls();

}


/* ============================================================
   COLOR
============================================================ */

function setColorTheme(
    theme
) {

    if (!currentDesign) {

        return;

    }


    const colors =
        COLOR_THEMES[
            theme
        ];


    if (!colors) {

        return;

    }


    currentDesign.primaryColor =
        colors.primary;


    currentDesign.secondaryColor =
        colors.secondary;


    currentDesign.accentColor =
        colors.accent;


    currentDesign.textColor =
        colors.text;


    document
        .getElementById(
            "customColor"
        )
        .value =
        colors.primary;


    renderMain();

    updateControls();

}


function setCustomColor(
    color
) {

    if (!currentDesign) {

        return;

    }


    currentDesign.primaryColor =
        color;


    currentDesign.accentColor =
        color;


    renderMain();

    updateControls();

}


/* ============================================================
   TYPOGRAPHY
============================================================ */

function setTypography(
    font
) {

    if (!currentDesign) {

        return;

    }


    if (!TYPOGRAPHY[font]) {

        return;

    }


    currentDesign.fontStyle =
        font;


    currentDesign.fontFamily =
        TYPOGRAPHY[
            font
        ].family;


    currentDesign.fontWeight =
        TYPOGRAPHY[
            font
        ].weight;


    currentDesign.letterSpacing =
        TYPOGRAPHY[
            font
        ].spacing;


    renderMain();

    updateControls();

}


/* ============================================================
   FONT FAMILY
============================================================ */

function setFontFamily(
    font
) {

    if (!currentDesign) {

        return;

    }


    currentDesign.fontFamily =
        font;


    renderMain();

}


/* ============================================================
   CONTROLS
============================================================ */

function updateControls() {

    if (!currentDesign) {

        return;

    }


    document
        .querySelectorAll(
            "[data-layout]"
        )
        .forEach(
            element => {

                element.classList.toggle(

                    "active",

                    element.dataset.layout
                    === currentDesign.layout

                );

            }
        );


    document
        .querySelectorAll(
            "[data-font]"
        )
        .forEach(
            element => {

                element.classList.toggle(

                    "active",

                    element.dataset.font
                    === currentDesign.fontStyle

                );

            }
        );


    const primary =
        currentDesign.primaryColor
            .toLowerCase();


    document
        .querySelectorAll(
            "[data-color]"
        )
        .forEach(
            element => {

                const theme =
                    COLOR_THEMES[
                        element.dataset.color
                    ];


                element.classList.toggle(

                    "active",

                    theme &&
                    theme.primary
                        .toLowerCase()
                    === primary

                );

            }
        );


    document
        .getElementById(
            "customColor"
        )
        .value =
        validColor(
            currentDesign.primaryColor,
            "#6366f1"
        );


    const fontSelect =
        document.getElementById(
            "fontSelect"
        );


    if (
        currentDesign.fontFamily
    ) {

        fontSelect.value =
            currentDesign.fontFamily;

    }

}


/* ============================================================
   DOWNLOAD SVG
============================================================ */

function downloadSVG() {

    if (!currentSVG) {

        return;

    }


    let svg =
        currentSVG;


    if (
        !svg.includes(
            'xmlns="http://www.w3.org/2000/svg"'
        )
    ) {

        svg =
            svg.replace(
                "<svg",
                '<svg xmlns="http://www.w3.org/2000/svg"'
            );

    }


    const blob =
        new Blob(

            [svg],

            {
                type:
                    "image/svg+xml;charset=utf-8"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        `${safeFileName(brandName)}-logo.svg`;


    document.body.appendChild(
        link
    );


    link.click();

    link.remove();


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        100
    );

}


/* ============================================================
   DOWNLOAD PNG
============================================================ */

function downloadPNG() {

    if (!currentSVG) {

        return;

    }


    const parser =
        new DOMParser();


    const svgDocument =
        parser.parseFromString(
            currentSVG,
            "image/svg+xml"
        );


    const svgElement =
        svgDocument.documentElement;


    const serializer =
        new XMLSerializer();


    const svgText =
        serializer.serializeToString(
            svgElement
        );


    const blob =
        new Blob(

            [svgText],

            {
                type:
                    "image/svg+xml;charset=utf-8"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const image =
        new Image();


    image.crossOrigin =
        "anonymous";


    image.onload =
        function() {

            const canvas =
                document.createElement(
                    "canvas"
                );


            canvas.width =
                2048;

            canvas.height =
                2048;


            const ctx =
                canvas.getContext(
                    "2d"
                );


            ctx.clearRect(
                0,
                0,
                2048,
                2048
            );


            ctx.drawImage(
                image,
                0,
                0,
                2048,
                2048
            );


            canvas.toBlob(
                blob => {

                    if (!blob) {

                        alert(
                            "PNG 변환에 실패했어."
                        );

                        return;

                    }


                    const pngURL =
                        URL.createObjectURL(
                            blob
                        );


                    const link =
                        document.createElement(
                            "a"
                        );


                    link.href =
                        pngURL;


                    link.download =
                        `${safeFileName(brandName)}-logo.png`;


                    document.body.appendChild(
                        link
                    );


                    link.click();


                    link.remove();


                    setTimeout(
                        () => {

                            URL.revokeObjectURL(
                                pngURL
                            );

                        },
                        100
                    );

                },

                "image/png"
            );


            URL.revokeObjectURL(
                url
            );

        };


    image.onerror =
        function() {

            URL.revokeObjectURL(
                url
            );


            alert(
                "PNG 변환에 실패했어. 아이콘 외부 리소스가 차단됐을 가능성이 있어."
            );

        };


    image.src =
        url;

}


/* ============================================================
   UTILITIES
============================================================ */

function validColor(
    color,
    fallback
) {

    if (
        typeof color !== "string"
    ) {

        return fallback;

    }


    return /^#[0-9A-Fa-f]{6}$/
        .test(color)
        ? color
        : fallback;

}


function validDirection(
    value,
    fallback
) {

    const allowed = [

        "Minimal",
        "Symbolic",
        "Monogram",
        "Emblem"

    ];


    return allowed.includes(
        value
    )
        ? value
        : fallback;

}


function validLayout(
    value,
    fallback
) {

    const allowed = [

        "icon-top",
        "icon-left",
        "icon-only"

    ];


    return allowed.includes(
        value
    )
        ? value
        : fallback;

}


function validShape(
    value,
    fallback
) {

    const allowed = [

        "none",
        "circle",
        "rounded-square",
        "hexagon",
        "pill"

    ];


    return allowed.includes(
        value
    )
        ? value
        : fallback;

}


function validFont(
    value,
    fallback
) {

    return TYPOGRAPHY[value]
        ? value
        : fallback;

}


function clamp(
    value,
    min,
    max
) {

    return Math.max(
        min,
        Math.min(
            max,
            value
        )
    );

}


function escapeXML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&apos;"
        );

}


function escapeHTML(
    value
) {

    return escapeXML(
        value
    );

}


function deepClone(
    object
) {

    return JSON.parse(
        JSON.stringify(
            object
        )
    );

}


function safeFileName(
    value
) {

    return String(
        value || "ai"
    )

        .replace(
            /[^a-zA-Z0-9가-힣_-]/g,
            "_"
        );

}


function setStatus(
    message
) {

    document
        .getElementById(
            "status"
        )
        .innerText =
        message;

}

</script>
